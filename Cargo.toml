[package]
name = "stethoscope-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
libc = "0.2.189"
rmcp = { version = "3.2", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
stethoscope-core = { path = "core" }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "io-std", "fs", "process", "time"] }

# build.rs digests the probes it embeds (decision 33).
[build-dependencies]
sha2 = "0.11.0"

[workspace]
members = [".", "core", "probes/rt", "probes/storage-health", "probes/system-info", "xtask"]
# Probes and their runtime are excluded: they build only under [profile.probe]
# and are built by `cargo xtask dev`, never by a plain `cargo build` (decision 33).
default-members = [".", "core", "xtask"]
resolver = "3"

# Every probe is built with this profile. Per-package overrides cannot set
# `panic` or `lto`, which is why it is a profile (decision 33).
[profile.probe]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
